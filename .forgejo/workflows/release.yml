# À chaque push sur main : compile l'APK, lance les tests unitaires, puis crée
# (ou met à jour) la release Gitea taguée avec versionName et y attache l'APK.
# Une release par versionName ; re-pousser sans changer la version remplace l'APK.
#
# S'exécute sur le runner « wsl-simon » (mode host) : il utilise le toolchain
# Android de la machine (~/android-toolchain : JDK 17, SDK, Gradle 8.14.3) et le
# cache Gradle de l'utilisateur, donc pas de téléchargement à chaque build.
name: Release APK

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: host
    steps:
      - name: Compiler, tester et publier l'APK
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Clé de signature fournie par des secrets de dépôt : le runner n'a plus
          # besoin du keystore ni de ~/.gradle locaux (portable sur tout runner).
          BREWHOME_KEYSTORE_B64: ${{ secrets.BREWHOME_KEYSTORE_B64 }}
          ORG_GRADLE_PROJECT_BREWHOME_STORE_PASSWORD: ${{ secrets.BREWHOME_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_BREWHOME_KEY_PASSWORD: ${{ secrets.BREWHOME_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_BREWHOME_KEY_ALIAS: ${{ secrets.BREWHOME_KEY_ALIAS }}
          # Racine du toolchain Android (JDK 17 + SDK + Gradle 8.14.3). Définir la
          # variable de dépôt ANDROID_TOOLCHAIN si le runner tourne sur une autre
          # machine ; sinon repli sur ~/android-toolchain (voir le script).
          ANDROID_TOOLCHAIN: ${{ vars.ANDROID_TOOLCHAIN }}
        run: |
          set -euo pipefail
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: token ${TOKEN}"

          # ── Sources au commit poussé ──
          HOST_PATH="${GITHUB_SERVER_URL#http://}"
          rm -rf src
          # credential.helper vide : ne surtout pas laisser le helper « store »
          # écrire le token éphémère dans ~/.git-credentials (il corrompt le
          # fichier au passage, cf. incident du 2026-07-15)
          git -c credential.helper= clone --branch "${GITHUB_REF_NAME}" --depth 20 \
            "http://oauth2:${TOKEN}@${HOST_PATH}/${GITHUB_REPOSITORY}.git" src
          cd src
          git checkout "${GITHUB_SHA}" || echo "SHA hors de la fenêtre de clone, build du tip de ${GITHUB_REF_NAME}"

          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "Version : $VERSION (commit $(git rev-parse --short HEAD))"

          # ── Clé de signature depuis les secrets (indépendant de ~/.gradle) ──
          # Décodée dans le clone éphémère ; ORG_GRADLE_PROJECT_* fournit le reste
          # des identifiants à Gradle sans les exposer en ligne de commande.
          KS="$PWD/ci-release.jks"
          printf '%s' "$BREWHOME_KEYSTORE_B64" | base64 -d > "$KS"
          export ORG_GRADLE_PROJECT_BREWHOME_STORE_FILE="$KS"

          # ── Build + tests avec le toolchain Android ($TOOLCHAIN) ──
          TOOLCHAIN="${ANDROID_TOOLCHAIN:-$HOME/android-toolchain}"
          export JAVA_HOME="$TOOLCHAIN/jdk-17.0.11+9"
          echo "sdk.dir=$TOOLCHAIN/sdk" > local.properties
          # Release = build minifié R8, signé avec la clé BrewHome (secrets)
          "$TOOLCHAIN/gradle-8.14.3/bin/gradle" -q assembleRelease testDebugUnitTest
          test -f app/build/outputs/apk/release/app-release.apk

          # ── Release Gitea (tags sans préfixe « v », convention existante) ──
          REL_ID=$(curl -s -H "$AUTH" "$API/releases/tags/$VERSION" \
                   | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")

          if [ -z "$REL_ID" ]; then
            REL_ID=$(curl -sf -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"$VERSION\",\"name\":\"BrewHome Android $VERSION\",
                   \"body\":\"APK compilé par la CI (commit ${GITHUB_SHA})\",
                   \"target_commitish\":\"${GITHUB_SHA}\"}" \
              "$API/releases" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
            echo "Release $VERSION créée (id $REL_ID)"
          else
            echo "Release $VERSION existante (id $REL_ID) : remplacement de l'APK"
            for AID in $(curl -s -H "$AUTH" "$API/releases/$REL_ID/assets" \
                | python3 -c "import json,sys; [print(a['id']) for a in json.load(sys.stdin) if a['name'].endswith('.apk')]"); do
              curl -sf -X DELETE -H "$AUTH" "$API/releases/$REL_ID/assets/$AID"
            done
          fi

          curl -sf -X POST -H "$AUTH" \
            -F "attachment=@app/build/outputs/apk/release/app-release.apk" \
            "$API/releases/$REL_ID/assets?name=BrewHome-$VERSION.apk" >/dev/null
          echo "APK attaché : BrewHome-$VERSION.apk"
